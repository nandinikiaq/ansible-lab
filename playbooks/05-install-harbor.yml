
---
- name: Install and Configure Harbor Registry on Ubuntu
  hosts: all
  become: true
  gather_facts: true

  vars:
    harbor_version: "v2.10.2"
    harbor_install_dir: "/opt/harbor"
    harbor_temp_dir: "/tmp/harbor"
    harbor_data_dir: "/data"
    harbor_hostname: "{{ ansible_host }}"
    harbor_admin_password: "Harbor12345"
    harbor_db_password: "HarborDB12345"

  tasks:

    - name: Install required packages
      apt:
        name:
          - tar
          - curl
          - openssl
        state: present
        update_cache: no

    - name: Check Docker installation
      command: docker --version
      changed_when: false

    - name: Check Docker Compose installation
      command: docker compose version
      changed_when: false

    - name: Create temporary Harbor directory
      file:
        path: "{{ harbor_temp_dir }}"
        state: directory
        mode: '0755'

    - name: Create Harbor data directory
      file:
        path: "{{ harbor_data_dir }}"
        state: directory
        mode: '0755'

    - name: Download Harbor offline installer
      get_url:
        url: "https://github.com/goharbor/harbor/releases/download/{{ harbor_version }}/harbor-offline-installer-{{ harbor_version }}.tgz"
        dest: "{{ harbor_temp_dir }}/harbor-offline-installer-{{ harbor_version }}.tgz"
        mode: '0644'

    - name: Extract Harbor installer
      unarchive:
        src: "{{ harbor_temp_dir }}/harbor-offline-installer-{{ harbor_version }}.tgz"
        dest: "/opt"
        remote_src: yes
        creates: "{{ harbor_install_dir }}/install.sh"

    - name: Configure Harbor hostname and HTTP
      copy:
        dest: "{{ harbor_install_dir }}/harbor.yml"
        owner: root
        group: root
        mode: '0600'
        content: |
          hostname: {{ harbor_hostname }}

          http:
            port: 80

          harbor_admin_password: {{ harbor_admin_password }}

          database:
            password: {{ harbor_db_password }}
            max_idle_conns: 100
            max_open_conns: 900
            conn_max_lifetime: 5m
            conn_max_idle_time: 0

          data_volume: {{ harbor_data_dir }}

          trivy:
            ignore_unfixed: false
            skip_update: false
            skip_java_db_update: false
            offline_scan: false
            security_check: vuln
            insecure: false

          jobservice:
            max_job_workers: 10
            job_loggers:
              - STD_OUTPUT
              - FILE
            logger_sweeper_duration: 1

          notification:
            webhook_job_max_retry: 3
            webhook_job_http_client_timeout: 3

          log:
            level: info
            local:
              rotate_count: 50
              rotate_size: 200M
              location: /var/log/harbor

          _version: 2.10.0

    - name: Verify Harbor configuration file
      command: cat {{ harbor_install_dir }}/harbor.yml
      changed_when: false

    - name: Run Harbor installer
      command: ./install.sh
      args:
        chdir: "{{ harbor_install_dir }}"
      register: harbor_install
      changed_when: harbor_install.rc == 0

    - name: Display Harbor installer output
      debug:
        var: harbor_install.stdout_lines

    - name: Wait for Harbor HTTP port
      wait_for:
        port: 80
        host: 127.0.0.1
        delay: 10
        timeout: 180

    - name: Check Harbor containers
      command: docker compose ps
      args:
        chdir: "{{ harbor_install_dir }}"
      register: harbor_status
      changed_when: false

    - name: Display Harbor container status
      debug:
        var: harbor_status.stdout_lines