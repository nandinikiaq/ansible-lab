
---
- name: Install and configure SonarQube on Ubuntu
  hosts: all
  become: true
  gather_facts: true

  vars:
    sonarqube_version: "9.9.6.92038"
    sonarqube_port: 8400
    sonar_db_name: sonar
    sonar_db_user: sonar
    sonar_db_password: "Sonar123!"

  tasks:

    - name: Install SonarQube prerequisites
      apt:
        name:
          - postgresql
          - postgresql-contrib
          - openjdk-17-jdk
          - curl
          - unzip
        state: present
        update_cache: yes

    - name: Ensure PostgreSQL is running
      systemd:
        name: postgresql
        state: started
        enabled: true

    - name: Create SonarQube PostgreSQL user and database
      shell: |
        if ! sudo -u postgres psql -tAc \
          "SELECT 1 FROM pg_roles WHERE rolname='{{ sonar_db_user }}'" | grep -q 1; then
          sudo -u postgres createuser {{ sonar_db_user }}
        fi

        if ! sudo -u postgres psql -tAc \
          "SELECT 1 FROM pg_database WHERE datname='{{ sonar_db_name }}'" | grep -q 1; then
          sudo -u postgres createdb -O {{ sonar_db_user }} {{ sonar_db_name }}
        fi

        sudo -u postgres psql -c \
          "ALTER USER {{ sonar_db_user }} WITH PASSWORD '{{ sonar_db_password }}';"
      args:
        executable: /bin/bash
      register: database_setup
      changed_when: false

    - name: Configure Linux kernel settings for SonarQube
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-sonarqube.conf
        reload: yes
      loop:
        - name: vm.max_map_count
          value: "524288"
        - name: fs.file-max
          value: "131072"

    - name: Create SonarQube system user
      user:
        name: sonarqube
        system: yes
        home: /opt/sonarqube
        shell: /usr/sbin/nologin
        create_home: no

    - name: Download SonarQube archive
      get_url:
        url: "https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-{{ sonarqube_version }}.zip"
        dest: "/tmp/sonarqube-{{ sonarqube_version }}.zip"
        mode: '0644'
        timeout: 120

    - name: Extract SonarQube archive
      unarchive:
        src: "/tmp/sonarqube-{{ sonarqube_version }}.zip"
        dest: /opt
        remote_src: yes
        creates: "/opt/sonarqube-{{ sonarqube_version }}"

    - name: Set SonarQube directory ownership
      file:
        path: "/opt/sonarqube-{{ sonarqube_version }}"
        owner: sonarqube
        group: sonarqube
        recurse: yes

    - name: Create SonarQube installation symlink
      file:
        src: "/opt/sonarqube-{{ sonarqube_version }}"
        dest: /opt/sonarqube
        state: link
        force: yes

    - name: Configure SonarQube database and web settings
      blockinfile:
        path: /opt/sonarqube/conf/sonar.properties
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          sonar.jdbc.username={{ sonar_db_user }}
          sonar.jdbc.password={{ sonar_db_password }}
          sonar.jdbc.url=jdbc:postgresql://localhost/{{ sonar_db_name }}
          sonar.web.host=0.0.0.0
          sonar.web.port={{ sonarqube_port }}
      notify: Restart SonarQube

    - name: Create SonarQube systemd service
      copy:
        dest: /etc/systemd/system/sonarqube.service
        content: |
          [Unit]
          Description=SonarQube Service
          Wants=network-online.target
          After=network-online.target postgresql.service
          Requires=postgresql.service

          [Service]
          Type=simple
          User=sonarqube
          Group=sonarqube
          ExecStart=/opt/sonarqube/bin/linux-x86-64/sonar.sh console
          Restart=on-failure
          RestartSec=10
          LimitNOFILE=131072
          LimitNPROC=8192
          StandardOutput=journal
          StandardError=inherit

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reload systemd
        - Restart SonarQube

    - name: Enable and start SonarQube
      systemd:
        name: sonarqube
        daemon_reload: yes
        enabled: true
        state: started

    - name: Wait for SonarQube port 8400
      wait_for:
        host: 127.0.0.1
        port: "{{ sonarqube_port }}"
        state: started
        delay: 10
        timeout: 300

    - name: Verify SonarQube HTTP API
      uri:
        url: "http://127.0.0.1:{{ sonarqube_port }}/api/system/status"
        method: GET
        return_content: yes
        status_code: 200
      register: sonar_status
      retries: 10
      delay: 15
      until: sonar_status.status == 200

    - name: Display SonarQube installation result
      debug:
        msg:
          - "SonarQube installation completed."
          - "Version: {{ sonarqube_version }}"
          - "Port: {{ sonarqube_port }}"
          - "URL: http://{{ ansible_host }}:{{ sonarqube_port }}"
          - "API response: {{ sonar_status.json }}"

  handlers:

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart SonarQube
      systemd:
        name: sonarqube
        state: restarted
        daemon_reload: yes