
---
- name: Install Jenkins on Ubuntu
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Install Java 21 and fontconfig
      apt:
        name:
          - fontconfig
          - openjdk-21-jre
        state: present
        update_cache: yes

    - name: Create Jenkins keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Jenkins 2026 GPG key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: '0644'

    - name: Configure Jenkins stable repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present
        update_cache: yes

    - name: Enable and start Jenkins
      service:
        name: jenkins
        state: started
        enabled: true

    - name: Wait for Jenkins UI
      wait_for:
        host: 127.0.0.1
        port: 8080
        delay: 20
        timeout: 180
