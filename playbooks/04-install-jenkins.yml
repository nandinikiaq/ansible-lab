---
- name: Install Jenkins on Ubuntu
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Install Java runtime for Jenkins
      apt:
        name: openjdk-17-jdk
        state: present
        update_cache: yes

    - name: Add Jenkins GPG key
      shell: |
        curl -fsSL https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key | gpg --dearmor -o /usr/share/keyrings/jenkins.gpg
        chmod a+r /usr/share/keyrings/jenkins.gpg
      args:
        executable: /bin/bash

    - name: Add Jenkins APT repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/jenkins.gpg] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present
        update_cache: yes

    - name: Ensure Jenkins service is enabled and running
      service:
        name: jenkins
        state: started
        enabled: true

    - name: Wait for Jenkins UI to become available
      wait_for:
        host: 127.0.0.1
        port: 8080
        delay: 20
        timeout: 180
