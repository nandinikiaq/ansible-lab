
---
- name: Install and configure SonarQube using Docker
  hosts: all
  become: true
  gather_facts: true

  vars:
    sonarqube_image: "sonarqube:community"
    sonarqube_port: 8400
    sonarqube_container: "sonarqube"

  tasks:

    - name: Display currently listening ports
      command: ss -tulpn
      register: listening_ports
      changed_when: false

    - name: Show currently listening ports
      debug:
        var: listening_ports.stdout_lines

    - name: Check whether SonarQube port is available
      wait_for:
        host: 127.0.0.1
        port: "{{ sonarqube_port }}"
        state: stopped
        timeout: 1

    - name: Install Docker prerequisites
      apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: yes

    - name: Check Docker installation
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      debug:
        var: docker_version.stdout

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Pull official SonarQube Community image
      community.docker.docker_image:
        name: "{{ sonarqube_image }}"
        source: pull

    - name: Create SonarQube data volume
      community.docker.docker_volume:
        name: sonarqube_data
        state: present

    - name: Create SonarQube extensions volume
      community.docker.docker_volume:
        name: sonarqube_extensions
        state: present

    - name: Create SonarQube logs volume
      community.docker.docker_volume:
        name: sonarqube_logs
        state: present

    - name: Start SonarQube container
      community.docker.docker_container:
        name: "{{ sonarqube_container }}"
        image: "{{ sonarqube_image }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ sonarqube_port }}:9000"
        volumes:
          - sonarqube_data:/opt/sonarqube/data
          - sonarqube_extensions:/opt/sonarqube/extensions
          - sonarqube_logs:/opt/sonarqube/logs
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"

    - name: Wait for SonarQube port
      wait_for:
        host: 127.0.0.1
        port: "{{ sonarqube_port }}"
        state: started
        delay: 10
        timeout: 300

    - name: Verify SonarQube HTTP response
      uri:
        url: "http://127.0.0.1:{{ sonarqube_port }}/api/system/status"
        method: GET
        return_content: yes
        status_code: 200
      register: sonar_http_status
      retries: 20
      delay: 15
      until: sonar_http_status.status == 200

    - name: Display SonarQube verification
      debug:
        msg:
          - "SonarQube is running successfully."
          - "Image: {{ sonarqube_image }}"
          - "Container: {{ sonarqube_container }}"
          - "Port: {{ sonarqube_port }}"
          - "URL: http://{{ ansible_host }}:{{ sonarqube_port }}"
          - "API status: {{ sonar_http_status.json }}"

