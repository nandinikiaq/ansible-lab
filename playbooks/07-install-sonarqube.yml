---
- name: Install and configure SonarQube on Ubuntu
  hosts: all
  become: true
  gather_facts: true
  vars:
    sonarqube_version: "9.9.6.100019"

  tasks:
    - name: Install SonarQube prerequisites
      apt:
        name:
          - postgresql
          - postgresql-contrib
          - openjdk-17-jdk
          - curl
          - unzip
        state: present
        update_cache: yes

    - name: Ensure PostgreSQL is running
      service:
        name: postgresql
        state: started
        enabled: true

    - name: Create SonarQube PostgreSQL user and database
      shell: |
        if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='sonar'" | grep -q 1; then sudo -u postgres createuser sonar; fi
        if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='sonar'" | grep -q 1; then sudo -u postgres createdb -O sonar sonar; fi
        sudo -u postgres psql -c "ALTER USER sonar WITH PASSWORD 'Sonar123!';"
      args:
        executable: /bin/bash

    - name: Create SonarQube system user
      user:
        name: sonarqube
        system: yes
        home: /opt/sonarqube
        shell: /usr/sbin/nologin
        create_home: no

    - name: Download SonarQube archive
      get_url:
        url: "https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-{{ sonarqube_version }}.zip"
        dest: "/tmp/sonarqube-{{ sonarqube_version }}.zip"
        mode: '0644'

    - name: Unpack SonarQube archive
      unarchive:
        src: "/tmp/sonarqube-{{ sonarqube_version }}.zip"
        dest: "/opt"
        remote_src: yes
        creates: "/opt/sonarqube-{{ sonarqube_version }}"

    - name: Set ownership on SonarQube directory
      file:
        path: "/opt/sonarqube-{{ sonarqube_version }}"
        owner: sonarqube
        group: sonarqube
        recurse: yes

    - name: Create symlink to SonarQube installation
      file:
        src: "/opt/sonarqube-{{ sonarqube_version }}"
        dest: /opt/sonarqube
        state: link
        force: yes

    - name: Configure database and web settings
      blockinfile:
        path: /opt/sonarqube/conf/sonar.properties
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          sonar.jdbc.username=sonar
          sonar.jdbc.password=Sonar123!
          sonar.jdbc.url=jdbc:postgresql://localhost/sonar
          sonar.web.host=0.0.0.0
          sonar.web.port=9000

    - name: Create SonarQube systemd service
      copy:
        dest: /etc/systemd/system/sonarqube.service
        content: |
          [Unit]
          Description=SonarQube Service
          After=syslog.target network.target

          [Service]
          Type=simple
          User=sonarqube
          Group=sonarqube
          ExecStart=/opt/sonarqube/bin/linux-x86-64/sonar.sh console
          Restart=always
          LimitNOFILE=65536
          StandardOutput=journal
          StandardError=inherit

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: '0644'

    - name: Start and enable SonarQube
      systemd:
        daemon_reload: yes
        name: sonarqube
        enabled: true
        state: started
